spring.datasource.url=jdbc:h2:mem:petbytes_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Force canned dialogue — disables @ConditionalOnProperty Gemini bean
dialogue.provider=scripted
gemini.api-key=fake
gemini.model=fake
gemini.base-url=http://localhost:9999

# Make tests deterministic
pet.variant.rate=0.0