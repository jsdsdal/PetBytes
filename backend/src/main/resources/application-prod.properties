# Database
spring.datasource.url=jdbc:mysql://db:3306/petbytes
spring.datasource.username=${PETBYTES_ADMIN}
spring.datasource.password=${PETBYTES_PW}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# AI
dialogue.provider=gemini
gemini.api-key=${GEMINI_API_KEY}

# Logging
logging.level.org.springframework.security=INFO