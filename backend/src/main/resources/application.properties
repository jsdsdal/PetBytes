# Spring
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:mysql://localhost:3306/petbytes
spring.datasource.username=${PETBYTES_ADMIN}
spring.datasource.password=${PETBYTES_PW}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AI
# Gemini Primary
gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite
dialogue.provider=gemini

# Fallback Provider
llm.fallback-url=https://openrouter.ai/api/v1
llm.fallback.api-key=${OPENROUTER_API_KEY}
llm.fallback.model=nvidia/nemotron-3.5-super-vl:free
dialogue.fallback-provider=openrouter

# Logging
logging.level.org.springframework.security=DEBUG

# Custom
pet.variant.rate=0.02