spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://localhost:3306/petbytes
spring.datasource.username=${PETBYTES_ADMIN}
spring.datasource.password=${PETBYTES_PW}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.ai.google.genai.api-key=${GEMINI_API_KEY:DUMMY_KEY_FOR_LOCAL_DEV}
spring.ai.google.genai.chat.model=gemini-2.5-flash

logging.level.org.springframework.security=DEBUG

pet.variant.rate=0.02
dialogue.provider=gemini