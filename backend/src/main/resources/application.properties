spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:mysql://localhost:3306/petbytes
spring.datasource.username=${PETBYTES_ADMIN}
spring.datasource.password=${PETBYTES_PW}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# jwt.secret=${JWT_SECRET}
llm.base-url=https://api.groq.com/openai/v1
llm.api-key=${GROQ_API_KEY}
llm.model=openai/gpt-oss-120b

logging.level.org.springframework.security=DEBUG

pet.variant.rate=0.02
dialogue.provider=gemini