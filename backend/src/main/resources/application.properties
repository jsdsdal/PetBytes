# Spring
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:mysql://localhost:3306/petbytes
spring.datasource.username=${PETBYTES_ADMIN}
spring.datasource.password=${PETBYTES_PW}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# AI
llm.base-url=https://openrouter.ai/api/v1
llm.api-key=${OPENROUTER_API_KEY}
llm.model=nvidia/nemotron-3.5-super-vl:free

# Logging
logging.level.org.springframework.security=DEBUG

# Custom
pet.variant.rate=0.02
dialogue.provider=groq