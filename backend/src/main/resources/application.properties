spring.profiles.active=dev

spring.datasource.url=jdbc:mysql://db:3306/petbytes
spring.datasource.username=${PETBYTES_ADMIN}
spring.datasource.password=${PETBYTES_PW}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# jwt.secret=${JWT_SECRET}

gemini.api-key=${GEMINI_API_KEY:DUMMY_KEY_FOR_LOCAL_DEV}
gemini.model=gemini-1.5-flash
gemini.base-url=https://generativelanguage.googleapis.com

logging.level.org.springframework.security=DEBUG

pet.variant.rate=0.02
dialogue.provider=gemini